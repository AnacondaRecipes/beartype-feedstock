{% set name = "beartype" %}
{% set version = "0.23.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 8b805f246b32931c74f2b321ea0939fe5bb2ff43c12a3eff19cc4c854b832e1d

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - hatchling >=1.14.0
    - pip
  run:
    - python

test:
  requires:
    - pytest
    - python
    - pip
  source_files:
    - conftest.py
    - pytest.ini
    - beartype_test
  imports:
    - beartype
  commands:
    # test_make_beartype_file_finder_path_hook_index is skipped, see https://github.com/beartype/beartype/issues/744
    - pytest beartype_test -vv -k "not make_beartype_file_finder_path_hook_index"
    - pip check

about:
  home: https://github.com/beartype/beartype
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Unbearably fast near-real-time hybrid runtime-static type-checking. Unbearably fast runtime type checking in pure Python.
  description: |
    Beartype is an open-source PEP-compliant near-real-time pure-Python hybrid
    runtime-static type checker emphasizing efficiency, usability, and thrilling
    puns.
  doc_url: https://beartype.readthedocs.io
  dev_url: https://github.com/beartype/beartype

extra:
  recipe-maintainers:
    - leycec
